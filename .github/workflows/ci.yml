name: ci

# Typecheck e build su Node 20 e 22: 20 e' il minimo dichiarato in `engines`,
# 22 e' cio' su cui gira davvero chi installa oggi. Un pacchetto che compila
# solo sulla versione dello sviluppatore e' un bug che si scopre in produzione
# di qualcun altro.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # `npm pack --dry-run` legge `files` e stampa cio' che finirebbe sul
      # registry: e' l'unico controllo che accorge se `dist/` non e' stato
      # costruito o se un file di troppo sta per essere pubblicato.
      - run: npm pack --dry-run
